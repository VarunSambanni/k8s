apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-deployment
  namespace: k8s-lab

spec:
  replicas: 3

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
